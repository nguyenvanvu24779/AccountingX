<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>AccountingX</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2B3490"/>
      <stop offset="1" stop-color="#111437"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC84A"/>
      <stop offset="1" stop-color="#FF9A1F"/>
    </linearGradient>
    <clipPath id="tile"><rect width="1024" height="1024" rx="232"/></clipPath>
    <!-- glyph box: flat horizontal cuts like a bold typeface X -->
    <clipPath id="glyph"><rect x="262" y="262" width="500" height="500"/></clipPath>
    <clipPath id="onWhite"><rect x="0" y="437" width="1024" height="150" transform="rotate(45 512 512)"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <g stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="8" stroke-linecap="round">
      <line x1="150" y1="262" x2="874" y2="262"/>
      <line x1="150" y1="387" x2="874" y2="387"/>
      <line x1="150" y1="512" x2="874" y2="512"/>
      <line x1="150" y1="637" x2="874" y2="637"/>
      <line x1="150" y1="762" x2="874" y2="762"/>
    </g>
    <g clip-path="url(#glyph)">
      <line x1="150" y1="150" x2="874" y2="874" stroke="#F3F5FF" stroke-width="150"/>
      <!-- weave gap only where the gold bar crosses the white bar -->
      <g clip-path="url(#onWhite)">
        <line x1="874" y1="150" x2="150" y2="874" stroke="#171B4F" stroke-width="214"/>
      </g>
      <line x1="874" y1="150" x2="150" y2="874" stroke="url(#gold)" stroke-width="150"/>
    </g>
  </g>
</svg>
